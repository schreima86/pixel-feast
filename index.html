<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pixel Feast</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Feast">
<meta name="theme-color" content="#1f3a2a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen arcade. Board on top (canvas), tray below: holding slots, then 3 stacks. Single committed look: night picnic. */
:root{
  --bg:#1f3a2a; --bg2:#173021; --wood:#8a5a2b; --wood2:#6e4620; --cream:#fff4dc;
  --fg:#fff7e6; --muted:#b8c9b5; --accent:#ffb627; --danger:#ff5d5d; --ok:#7ddc73;
  --slot:#2a4a37; --slot-b:#4c7a5c;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}
h1{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0;letter-spacing:.02em;color:var(--accent)}
.hud{display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.pill{background:var(--slot);border:1px solid var(--slot-b);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.85rem}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:8px 12px;background:var(--accent);color:#2b1d00;cursor:pointer;box-shadow:0 3px 0 #b87d0e}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #b87d0e}
button.ghost{background:var(--slot);color:var(--fg);box-shadow:0 3px 0 #11241a;border:1px solid var(--slot-b)}
button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
#boardWrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;image-rendering:pixelated;border-radius:10px;background:var(--bg2);box-shadow:inset 0 0 0 2px #0f2217}
.tray{flex:0 0 auto;background:linear-gradient(var(--wood),var(--wood2));border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #4a2f14}
.label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);opacity:.8;font-weight:800}
.slots{display:flex;gap:8px;justify-content:center}
.slot{flex:1 1 0;max-width:72px;aspect-ratio:1;border-radius:12px;background:var(--slot);border:2px dashed var(--slot-b);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.slot.full{border-style:solid}
.ant{width:72%;height:72%;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.1rem;color:#fff;text-shadow:0 1px 2px #0008;position:relative}
.ant::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 -4px 0 #0003}
.ant.wait{animation:wobble 1.2s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.stacks{display:flex;gap:10px;justify-content:center}
.stack{flex:1 1 0;max-width:110px;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;min-height:92px}
.tile{width:100%;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:.9rem;color:#fff;text-shadow:0 1px 2px #0008;opacity:.55;transform:scale(.92)}
.tile.top{height:38px;opacity:1;transform:none;cursor:pointer;box-shadow:0 4px 0 #0005;font-size:1.1rem;border:2px solid #fff6}
.tile.top:active{transform:translateY(2px)}
.tile.more{background:#0004!important;color:var(--cream);font-size:.75rem;height:18px;opacity:.9;transform:none}
.overlay{position:fixed;inset:0;background:#0b1a11cc;display:flex;align-items:center;justify-content:center;padding:24px;z-index:20;backdrop-filter:blur(4px)}
.card{background:var(--cream);color:#2b1d00;border-radius:20px;padding:24px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);margin:0;font-size:1.8rem;text-wrap:balance}
.card p{margin:0;line-height:1.45}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card button.ghost{background:#e8dcc0;color:#2b1d00;box-shadow:0 3px 0 #c5b48f;border:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--cream);color:#2b1d00;padding:8px 14px;border-radius:999px;font-weight:800;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.ant.wait{animation:none}}
</style>
</head>
<body>

<header>
  <h1>Pixel Feast</h1>
  <div class="hud">
    <span class="pill" id="lvl">Level 1</span>
    <span class="pill" id="left">0</span>
    <button class="ghost" id="btnSwap" title="Oberste Kacheln zweier Stapel tauschen">Tausch ×3</button>
    <button class="ghost" id="btnRestart">↻</button>
  </div>
</header>
<div id="boardWrap"><canvas id="board"></canvas></div>
<div class="tray">
  <div class="label">Warteplätze</div>
  <div class="slots" id="slots"></div>
  <div class="label">Stapel – oberste Kachel antippen</div>
  <div class="stacks" id="stacks"></div>
</div>
<div class="toast" id="toast"></div>
<div id="overlay" class="overlay" hidden></div>

<script>
(() => {
'use strict';
// ---------- Pixel art levels (12 wide). Letters = palette keys. '.' = empty ----------
const PAL = {R:'#e8453c',G:'#3fae4a',L:'#9bdc5a',Y:'#ffd23f',O:'#ff8c2b',B:'#8b5a2b',W:'#fff4dc',P:'#ff7bb0',K:'#2b2b2b',C:'#48c7e6',V:'#9b6cf0',T:'#f2c48a',D:'#b23a2f',N:'#5a3a1a'};
const LEVELS = [
 {name:'Apfel', slots:4, cap:[5,8], art:`
.....NN.....
....NN.L....
...N...LL...
..RRRRRRRR..
.RRRRRRRRRR.
RRRWRRRRRRRR
RRRWRRRRRRRR
RRRRRRRRRRRR
RRRRRRRRRRRR
.RRRRRRRRRR.
..RRR..RRR..`},
 {name:'Kirschen', slots:4, cap:[4,7], art:`
......G.....
.....GG.....
....G.GG....
...G...G....
..G....G....
.RRR..RRR...
RRRRR.RRRRR.
RRRRRRRRRRR.
RRRRRRRRRRR.
.RRR..RRR...`},
 {name:'Burger', slots:4, cap:[4,7], art:`
...TTTTTT...
..TTWTTTWT..
.TTTTTTTTTT.
.LLLLLLLLLL.
.RRRRRRRRRR.
.YYYYYYYYYY.
.NNNNNNNNNN.
.NNNNNNNNNN.
.TTTTTTTTTT.
..TTTTTTTT..`},
 {name:'Eis', slots:4, cap:[4,6], art:`
....PPPP....
...PPPPPP...
..PPPPPPPP..
..CCCCCCCC..
.CCCCCCCCCC.
..WWWWWWWW..
..TTTTTTTT..
...TNTNTN...
...TTTTTT...
....TNTN....
....TTTT....
.....TT.....`},
 {name:'Melone', slots:5, cap:[4,6], art:`
............
GGGGGGGGGGGG
LLLLLLLLLLLL
.WWWWWWWWWW.
.RRRRRRRRRR.
..RRKRRKRR..
..RRRRRRRR..
...RKRRKR...
...RRRRRR...
....RRRR....
.....RR.....`},
 {name:'Pizza', slots:5, cap:[3,6], art:`
.....BB.....
....BYYB....
...BYRYYB...
...BYYYRB...
..BYYRYYYB..
..BYYYYYYB..
.BYRYYYRYYB.
.BYYYYYYYYB.
BYYYYRYYYRYB
BYRYYYYYYYYB
BBBBBBBBBBBB`},
 {name:'Donut', slots:5, cap:[3,5], art:`
...PPPPPP...
..PPCPPYPP..
.PPPPPPPPPP.
.PPP....PPP.
PPY..TT..CPP
PPP..TT..PPP
.PPP....PPP.
.TPPPPCPPPT.
.TTTPPPPTTT.
..TTTTTTTT..
...TTTTTT...`},
 {name:'Sushi', slots:5, cap:[3,5], art:`
..OOOOOOOO..
.OOOOOOOOOO.
.OOWOOOOWOO.
.WWWWWWWWWW.
.WWWWWWWWWW.
KKKKKKKKKKKK
KKKKKKKKKKKK
.KKGGGGGGKK.
.KKGVVVVGKK.
.KKGGGGGGKK.
KKKKKKKKKKKK`},
 {name:'Erdbeere', slots:5, cap:[3,5], art:`
.....GG.....
...GGGGGG...
..GGLGGLGG..
.RRRGGGGRRR.
RRRYRRRRYRRR
RRRRRRRRRRRR
RYRRRYRRYRRR
RRRRRRRRRRRR
.RRYRRRRYRR.
..RRRRRRRR..
...RRYYRR...
....RRRR....`},
 {name:'Torte', slots:6, cap:[3,5], art:`
.....R......
....YYY.....
.WWWWWWWWWW.
.PPPPPPPPPP.
.PPPPPPPPPP.
.NNNNNNNNNN.
.WWWWWWWWWW.
.PPPPPPPPPP.
.PPPPPPPPPP.
.NNNNNNNNNN.
BBBBBBBBBBBB
.CCCCCCCCCC.`},
];

// ---------- State ----------
let L = 0, grid, W, H, slots, stacks, swaps, left, busy=false, anim=[], rng;
const cv = document.getElementById('board'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
function seedRng(s){ return () => (s = (s*1664525+1013904223)>>>0) / 4294967296; }

function loadLevel(i){
  L = i; const lv = LEVELS[i]; rng = seedRng(1234+i*97);
  const rows = lv.art.trim().split('\n'); H = rows.length; W = Math.max(...rows.map(r=>r.length));
  grid = rows.map(r => Array.from({length:W},(_,x)=> (r[x]&&r[x]!=='.')?r[x]:null));
  // count colors, split into tiles of capacity [min,max]
  const cnt = {}; grid.flat().forEach(c=>{ if(c) cnt[c]=(cnt[c]||0)+1; });
  left = Object.values(cnt).reduce((a,b)=>a+b,0);
  let tiles=[];
  for(const c in cnt){ let n=cnt[c]; while(n>0){ const k=Math.min(n, lv.cap[0]+Math.floor(rng()*(lv.cap[1]-lv.cap[0]+1))); tiles.push({c,n:k}); n-=k; } }
  // order by exposure depth (bottom/outside first) + jitter → mostly solvable, not trivial
  const depth = depthMap(); const avg={};
  for(const c in cnt){ let s=0; grid.forEach((r,y)=>r.forEach((v,x)=>{ if(v===c) s+=depth[y][x]; })); avg[c]=s/cnt[c]; }
  tiles.forEach(t=> t.k = avg[t.c] + rng()*2.2 - 1.1 + (t.n*0.05));
  tiles.sort((a,b)=>a.k-b.k);
  stacks=[[],[],[]]; tiles.forEach((t,j)=> stacks[j%3].push(t));
  stacks.forEach(s=>s.reverse()); // index 0 = bottom, last = top
  slots = Array(lv.slots).fill(null); swaps=3; anim=[]; busy=false;
  $('lvl').textContent = `Level ${i+1} · ${lv.name}`;
  $('btnSwap').textContent = `Tausch ×${swaps}`; $('btnSwap').disabled=false;
  fit(); render(); save();
}

// BFS distance from outside (through empty cells) — 0 = adjacent to outside/empty region
function depthMap(){
  const d = grid.map(r=>r.map(()=>Infinity)); const q=[];
  const exposed = exposedSet();
  exposed.forEach(k=>{ const [x,y]=k.split(',').map(Number); d[y][x]=0; q.push([x,y]); });
  while(q.length){ const [x,y]=q.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H||!grid[ny][nx]) continue;
      if(d[ny][nx]>d[y][x]+1){ d[ny][nx]=d[y][x]+1; q.push([nx,ny]); } } }
  return d;
}
// cells (with a block) that touch the outside region (border or empty cell connected to border)
function exposedSet(){
  const out = Array.from({length:H},()=>Array(W).fill(false)); const q=[];
  const push=(x,y)=>{ if(x<0||y<0||x>=W||y>=H||out[y][x]||grid[y][x]) return; out[y][x]=true; q.push([x,y]); };
  for(let x=0;x<W;x++){ push(x,0); push(x,H-1); } for(let y=0;y<H;y++){ push(0,y); push(W-1,y); }
  while(q.length){ const [x,y]=q.shift(); push(x+1,y);push(x-1,y);push(x,y+1);push(x,y-1); }
  const set=new Set();
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ if(!grid[y][x]) continue;
    const edge = x===0||y===0||x===W-1||y===H-1;
    if(edge || (out[y]?.[x+1]) || (out[y]?.[x-1]) || (out[y+1]?.[x]) || (out[y-1]?.[x])) set.add(x+','+y); }
  return set;
}

// ---------- Game actions ----------
function tapStack(i){
  if(busy) return; const st=stacks[i]; if(!st.length) return;
  const free = slots.findIndex(s=>!s); if(free<0){ toast('Alle Warteplätze voll!'); return; }
  const t = st.pop(); slots[free] = {c:t.c, n:t.n, wait:false};
  render(); feed();
}
async function feed(){
  busy=true; let progress=true;
  while(progress){ progress=false;
    const ex = exposedSet();
    for(let s=0;s<slots.length;s++){ const a=slots[s]; if(!a) continue;
      // eat exposed blocks of its color, nearest-to-bottom first
      const cells=[]; for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(grid[y][x]===a.c && ex.has(x+','+y)) cells.push([x,y]);
      cells.sort((p,q)=> q[1]-p[1] || Math.abs(p[0]-W/2)-Math.abs(q[0]-W/2));
      for(const [x,y] of cells){ if(a.n<=0) break;
        grid[y][x]=null; a.n--; left--; anim.push({x,y,c:a.c,t:performance.now()}); progress=true; chomp();
        render(); await sleep(55);
      }
      if(a.n<=0 || !gridHas(a.c)){ slots[s]=null; render(); }
      else a.wait=true;
    }
  }
  busy=false; render();
  if(left<=0) return win();
  if(slots.every(s=>s)) { // all full and no progress
    if(!slots.some(s=>s&&s.n>0&&canEat(s.c))) lose();
  }
}
const canEat = c => { const ex=exposedSet(); for(const k of ex){ const [x,y]=k.split(',').map(Number); if(grid[y][x]===c) return true; } return false; };
const gridHas = c => grid.some(r=>r.includes(c));
let swapSel=null;
function swapTop(i){
  if(swapSel===null){ swapSel=i; toast('Zweiten Stapel wählen'); render(); return; }
  if(swapSel!==i && stacks[i].length && stacks[swapSel].length){
    const a=stacks[i], b=stacks[swapSel]; const t=a[a.length-1]; a[a.length-1]=b[b.length-1]; b[b.length-1]=t;
    swaps--; $('btnSwap').textContent=`Tausch ×${swaps}`; if(!swaps) $('btnSwap').disabled=true;
  }
  swapSel=null; swapMode=false; render();
}
let swapMode=false;
$('btnSwap').onclick=()=>{ if(!swaps||busy) return; swapMode=!swapMode; swapSel=null; toast(swapMode?'Stapel 1 wählen':'Tausch abgebrochen'); render(); };
$('btnRestart').onclick=()=>loadLevel(L);

function win(){ try{ localStorage.setItem('pf_best', String(Math.max(L+1, +localStorage.getItem('pf_best')||0))); }catch(e){}
  overlay(`<h2>Alles aufgefuttert! 🐜</h2><p>${LEVELS[L].name} ist blank. ${L+1<LEVELS.length?'Nächstes Bild wartet.':'Das war das letzte Level – von vorn?'}</p>
  <div class="row"><button id="oNext">${L+1<LEVELS.length?'Weiter':'Nochmal von vorn'}</button></div>`);
  $('oNext').onclick=()=>{ hideOverlay(); loadLevel((L+1)%LEVELS.length); };
}
function lose(){ overlay(`<h2>Ameisen stecken fest</h2><p>Alle Warteplätze belegt und keine erreichbaren Blöcke in diesen Farben. Reihenfolge ändern – zuerst die große Farbe, die Kleckse zuletzt.</p>
  <div class="row"><button id="oRetry">Nochmal</button></div>`); $('oRetry').onclick=()=>{ hideOverlay(); loadLevel(L); }; }
function overlay(html){ const o=$('overlay'); o.innerHTML=`<div class="card">${html}</div>`; o.hidden=false; }
function hideOverlay(){ $('overlay').hidden=true; }
function save(){ try{ localStorage.setItem('pf_level', String(L)); }catch(e){} }

// ---------- Rendering ----------
function fit(){
  const wrap=$('boardWrap'); const r=wrap.getBoundingClientRect();
  const cell=Math.floor(Math.min(r.width/W, r.height/H)); const s=Math.max(cell,8);
  cv.width=W*s; cv.height=H*s; cv.style.width=cv.width+'px'; cv.style.height=cv.height+'px';
}
function draw(now){
  const s=cv.width/W; ctx.clearRect(0,0,cv.width,cv.height);
  // checker ground
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ ctx.fillStyle=(x+y)%2?'#1a3325':'#1c3828'; ctx.fillRect(x*s,y*s,s,s); }
  const ex = exposedSet();
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const c=grid[y][x]; if(!c) continue;
    ctx.fillStyle=PAL[c]; ctx.fillRect(x*s+1,y*s+1,s-2,s-2);
    ctx.fillStyle='#fff3'; ctx.fillRect(x*s+1,y*s+1,s-2,Math.max(2,s*.18));
    ctx.fillStyle='#0003'; ctx.fillRect(x*s+1,y*s+s-1-Math.max(2,s*.14),s-2,Math.max(2,s*.14));
    if(!ex.has(x+','+y)){ ctx.fillStyle='#0004'; ctx.fillRect(x*s+1,y*s+1,s-2,s-2); }
  }
  // chomp animations: shrinking block + crumbs + ant dot
  anim = anim.filter(a=> now-a.t<320);
  for(const a of anim){ const p=(now-a.t)/320, k=(1-p)*s*.9;
    ctx.fillStyle=PAL[a.c]; ctx.fillRect(a.x*s+(s-k)/2, a.y*s+(s-k)/2, k, k);
    ctx.fillStyle='#2b2b2b'; const ox=a.x*s+s/2+Math.sin(p*9)*s*.25, oy=a.y*s+s/2+(1-p)*s*.6;
    ctx.beginPath(); ctx.arc(ox,oy,Math.max(2,s*.12),0,7); ctx.fill();
    for(let i=0;i<3;i++){ ctx.fillStyle=PAL[a.c]; ctx.fillRect(a.x*s+s/2+Math.cos(i*2.1)*p*s*.6, a.y*s+s/2+Math.sin(i*2.1)*p*s*.6+p*p*s*.5, 2,2); }
  }
  if(anim.length) requestAnimationFrame(draw);
}
function render(){
  requestAnimationFrame(draw);
  $('left').textContent=`${left} Blöcke`;
  $('slots').innerHTML = slots.map(a=> a
    ? `<div class="slot full"><div class="ant ${a.wait?'wait':''}" style="background:${PAL[a.c]}">${a.n}</div></div>`
    : `<div class="slot"></div>`).join('');
  $('stacks').innerHTML = stacks.map((st,i)=>{
    const vis = st.slice(-4); const more = st.length-vis.length;
    return `<div class="stack" data-i="${i}">${vis.map((t,j)=>`<div class="tile ${j===vis.length-1?'top':''}" style="background:${PAL[t.c]};${swapMode&&j===vis.length-1?'outline:3px solid #fff;outline-offset:2px':''}${swapSel===i&&j===vis.length-1?';outline-color:#ffb627':''}">${j===vis.length-1?t.n:''}</div>`).join('')}${more>0?`<div class="tile more">+${more}</div>`:''}</div>`;
  }).join('');
  document.querySelectorAll('.stack').forEach(el=> el.onclick=()=>{ const i=+el.dataset.i; swapMode?swapTop(i):tapStack(i); });
}
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1400); }
const sleep = ms => new Promise(r=>setTimeout(r,ms));

// tiny chomp sound (WebAudio, starts after first tap)
let ac; function chomp(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain();
  o.type='square'; o.frequency.setValueAtTime(220+Math.random()*120,ac.currentTime); o.frequency.exponentialRampToValueAtTime(90,ac.currentTime+.06);
  g.gain.setValueAtTime(.05,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.07); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.08);}catch(e){} }

window.addEventListener('resize',()=>{ fit(); render(); });
let start=0; try{ start=Math.min(+localStorage.getItem('pf_level')||0, LEVELS.length-1); }catch(e){}
loadLevel(start);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
